name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install Tesseract and Inno Setup
        shell: powershell
        run: |
          choco install tesseract --yes --no-progress
          choco install innosetup --yes --no-progress

          $tesseract = "C:\Program Files\Tesseract-OCR"

          if (!(Test-Path "$tesseract\tesseract.exe")) {
            throw "Tesseract was not installed correctly."
          }

          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/hin.traineddata" `
            -OutFile "$tesseract\tessdata\hin.traineddata"

          "TESSERACT_DIR=$tesseract" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Build Windows application
        run: |
          python -m PyInstaller --noconfirm --clean ElectionPDFConverter.spec

      - name: Prepare application folder
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item -Recurse -Force `
            "dist\ElectionPDFConverter" `
            "release\ElectionPDFConverter"

      - name: Build Setup EXE
        shell: powershell
        run: |
          $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

          if (!(Test-Path $compiler)) {
            $compiler = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }

          if (!(Test-Path $compiler)) {
            throw "Inno Setup compiler was not found."
          }

          & $compiler "installer\ElectionPDFConverter.iss"

      - name: Upload finished installer
        uses: actions/upload-artifact@v4
        with:
          name: ElectionPDFConverter-Windows
          path: release/ElectionPDFConverter_Setup.exe
          if-no-files-found: error
