name: Build Standalone Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - single-exe-offline-v4
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Publish workflow run ID
        shell: powershell
        run: |
          $state = Join-Path $env:RUNNER_TEMP "strict-run-state"
          git fetch origin build-run-state
          git worktree add $state origin/build-run-state
          Push-Location $state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          "${{ github.run_id }}" | Set-Content -Encoding ascii latest_strict_run.txt
          "${{ github.sha }}" | Set-Content -Encoding ascii latest_strict_sha.txt
          "${{ github.event_name }}" | Set-Content -Encoding ascii latest_strict_event.txt
          git add latest_strict_run.txt latest_strict_sha.txt latest_strict_event.txt
          git commit -m "Record strict build run ${{ github.run_id }}"
          git push origin HEAD:build-run-state
          Pop-Location

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install portable OCR build dependencies
        shell: powershell
        run: |
          choco install tesseract --yes --no-progress
          $tesseract = "C:\Program Files\Tesseract-OCR"
          if (!(Test-Path "$tesseract\tesseract.exe")) {
            throw "Tesseract was not installed correctly."
          }
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/hin.traineddata" `
            -OutFile "$tesseract\tessdata\hin.traineddata"
          if (!(Test-Path "$tesseract\tessdata\eng.traineddata")) {
            Invoke-WebRequest `
              -Uri "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/eng.traineddata" `
              -OutFile "$tesseract\tessdata\eng.traineddata"
          }
          "TESSERACT_DIR=$tesseract" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Validate strict quality reader
        run: |
          python -m compileall -q app.py backend launcher_windows.py quality_selftest.py
          python quality_selftest.py
          python -c "import app; from backend.config import ConversionConfig; assert ConversionConfig().mode == 'turbo'; assert ConversionConfig().settings.dpi == 250; print('Strict reader source ready')"

      - name: Build one standalone EXE
        run: |
          python -m PyInstaller --noconfirm --clean ElectionPDFConverter.spec

      - name: Verify EXE and bundled OCR
        shell: powershell
        run: |
          $exe = Resolve-Path "dist\VoterListConverter.exe"
          if (!(Test-Path $exe)) { throw "Standalone EXE was not created." }
          $size = (Get-Item $exe).Length
          if ($size -lt 50000000) { throw "EXE is unexpectedly small and may not contain OCR dependencies." }

          $process = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Packaged EXE strict reader self-test failed with exit code $($process.ExitCode)."
          }

          Get-FileHash $exe -Algorithm SHA256 | Format-List

      - name: Upload standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: VoterListConverter-Strict-Clean-Windows-x64
          path: dist/VoterListConverter.exe
          if-no-files-found: error

      - name: Publish PR artifact locator
        if: github.event_name == 'pull_request'
        shell: powershell
        run: |
          Write-Error "Strict clean EXE artifact uploaded. This intentional PR-only marker exposes the run ID for delivery."
          exit 1
